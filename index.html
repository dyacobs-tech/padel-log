<style>
:root{--tie:#ffd60a;--unf:#8e8e93;--bg:#000;--card:#101012;--card2:#1b1b1e;--txt:#f5f5f7;--mut:#8e8e93;--acc:#c6f432;--win:#30d158;--loss:#ff453a;--tr:#0a84ff;--bd:rgba(255,255,255,.09);--r:8px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

header{padding:calc(18px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:auto}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.02em}h1 b{color:var(--acc)}
main{padding:0 16px;max-width:640px;margin:auto;animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px 16px;margin:0 0 12px}
h2{font-size:11px;font-weight:700;margin:0 0 14px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,24,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bd);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mut);padding:6px 0;font:700 8.5px/1.2 inherit;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--acc)}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.12em}
input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--bd);border-radius:8px;padding:12px;font:16px inherit;outline:none;transition:border-color .2s}input:focus,textarea:focus{border-color:var(--acc)}
.seg{display:flex;gap:2px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:3px}
#grseg{flex-wrap:wrap}#grseg button{flex:1 1 14%}.seg button{flex:1;padding:8px;border-radius:7px;border:0;background:none;color:var(--txt);font:600 14px inherit;transition:all .2s}.seg button.on{background:var(--acc);color:#000}
.btn{background:var(--acc);color:#000;border:0;border-radius:8px;padding:15px 16px;font:800 14px inherit;text-transform:uppercase;letter-spacing:.08em;width:100%;margin-top:16px;transition:transform .1s,opacity .2s}.btn:active{transform:scale(.98);opacity:.85}.btn.sec{background:var(--card2);color:var(--txt)}.btn.red{background:rgba(255,69,58,.15);color:var(--loss)}
.row{display:flex;gap:8px}.row>*{flex:1}.sets{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.card .kpis{margin:0}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}.card .kpi{background:var(--card2);border:0}
.kpi b{font-size:34px;font-weight:800;letter-spacing:-1px;display:block;color:var(--txt)}.kpi small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}

.item{border-bottom:1px solid var(--bd);padding:12px 0}.item:last-child{border:0;padding-bottom:0}.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}.mut{color:var(--mut);font-size:13px}
.p{color:var(--txt);font-weight:600;border-bottom:1px dashed rgba(198,244,50,.6);cursor:pointer}.tag{font-size:10px;font-weight:700;padding:4px 7px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
.acts button{background:var(--card2);border:0;color:var(--mut);border-radius:6px;padding:4px 12px;margin-left:4px;font:500 12px inherit}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}tr:last-child td{border:0}th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:11px;color:var(--mut);font-weight:600;padding-bottom:4px}.cal .d{border-radius:8px;min-height:48px;padding:8px 0 4px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}
.cal .d.o{opacity:.25}.cal .d.today{color:var(--acc);font-weight:700}.cal .d.sel{background:var(--card2);border-color:var(--bd)}.dots{display:flex;justify-content:center;gap:3px;margin-top:4px;min-height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.nav2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.nav2 button{background:var(--card2);border:0;color:var(--txt);border-radius:8px;width:36px;height:36px;font-size:18px}.nav2 b{flex:1;text-align:center;font-size:17px}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding-bottom:calc(32px + env(safe-area-inset-bottom));animation:slide .28s cubic-bezier(.2,.8,.2,1)}@keyframes slide{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}.hidden{display:none}
.big{font-size:38px;font-weight:800;letter-spacing:-1px;color:var(--txt)}.demo{background:rgba(255,214,10,.12);color:#ffd60a;border-radius:8px;padding:8px 12px;font-size:13px}
#calest{color:var(--acc)}
.X{background:#ffd60a;color:#000}.U{background:#8e8e93;color:#000}
</style></head><body>
<header><h1>PADEL <b>LOG</b></h1><span class="mut" id="hdrinfo"></span></header>
<div id="due"></div><main id="app"></main>
<div id="modal" class="modal hidden"></div>
<nav id="nav"></nav>
<datalist id="names"></datalist>
<script>
const K='padellog.v2';
let S=JSON.parse(localStorage.getItem(K)||'null')||{sessions:[],weight:176,unit:'lb'};
if(!S.upcoming)S.upcoming=[];
const save=()=>{localStorage.setItem(K,JSON.stringify(S));try{trackChanges();schedSync()}catch(e){console.error(e)}};
// ---------- CLOUD SYNC ----------
const SYNC_URL=localStorage.getItem('padellog.syncurl')||'https://padel-log-sync.dyacobs-tech.deno.net';
const SK='padellog.sync';let SY=JSON.parse(localStorage.getItem(SK)||'null')||{key:null,last:0,snap:{s:{},u:{},m:''},st:{s:{},u:{},m:0},tomb:{s:{},u:{}},dirty:{s:{},u:{},m:0},status:'Not synced yet',lastOk:0};
const saveSY=()=>localStorage.setItem(SK,JSON.stringify(SY));
const hsh=x=>{const t=JSON.stringify(x);let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h.toString(36)+t.length};
const META_F=['profile','weight','unit','startLevels','lefty','deletedSeeds'];const metaOf=()=>Object.fromEntries(META_F.map(f=>[f,S[f]??null]));
const COLL={s:()=>S.sessions,u:()=>S.upcoming||[]};
function trackChanges(){const now=Date.now();let ch=false;for(const c of ['s','u']){const seen=new Set();COLL[c]().forEach(x=>{seen.add(x.id);const h=hsh(x);if(SY.snap[c][x.id]!==h){SY.snap[c][x.id]=h;SY.st[c][x.id]=now;SY.dirty[c][x.id]=1;delete SY.tomb[c][x.id];ch=true}});
  Object.keys(SY.snap[c]).forEach(id=>{if(!seen.has(id)){delete SY.snap[c][id];delete SY.st[c][id];SY.tomb[c][id]=now;SY.dirty[c][id]=1;ch=true}})}
 const mh=hsh(metaOf());if(SY.snap.m!==mh){SY.snap.m=mh;SY.st.m=now;SY.dirty.m=1;ch=true}if(ch)saveSY()}
let _sT=null,_syncing=false;function schedSync(){clearTimeout(_sT);_sT=setTimeout(()=>syncNow(),1500)}
function setSyncStatus(t){SY.status=t;saveSY();const e=$('#syncstat');if(e)e.innerHTML=syncStatusHTML()}
async function syncNow(){if(_syncing||SYNC_URL.startsWith('__'))return;if(!navigator.onLine){setSyncStatus('Offline — will sync when back online');return}_syncing=true;
 try{if(!SY.key){setSyncStatus('Creating sync account…');const r=await fetch(SYNC_URL+'/register',{method:'POST'});if(!r.ok)throw new Error('register '+r.status);const j=await r.json();SY.key=j.key;SY.acct=j.acct;SY.last=0;
   // first upload: everything local is dirty
   for(const c of ['s','u'])COLL[c]().forEach(x=>{SY.dirty[c][x.id]=1;SY.st[c][x.id]=SY.st[c][x.id]||Date.now()});SY.dirty.m=1;SY.st.m=SY.st.m||Date.now();saveSY()}
  setSyncStatus('Syncing…');const changes=[];for(const c of ['s','u'])Object.keys(SY.dirty[c]).forEach(id=>{const x=COLL[c]().find(y=>y.id===id);if(x)changes.push({coll:c,id,updatedAt:SY.st[c][id]||Date.now(),data:x});else if(SY.tomb[c][id])changes.push({coll:c,id,updatedAt:SY.tomb[c][id],deleted:true})});
  const body={since:SY.last,changes,meta:SY.dirty.m?{updatedAt:SY.st.m||Date.now(),data:metaOf()}:null};
  const r=await fetch(SYNC_URL+'/sync',{method:'POST',headers:{'authorization':'Bearer '+SY.key,'content-type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){SY.key=null;saveSY();throw new Error('sync key rejected')}if(!r.ok)throw new Error('sync '+r.status);const j=await r.json();
  SY.dirty={s:{},u:{},m:0};let changed=false;
  for(const x of j.recs||[]){const c=x.coll;if(!COLL[c])continue;const loc=SY.st[c][x.id]||SY.tomb[c][x.id]||0;if(x.updatedAt<=loc)continue;
   if(c==='u'&&!S.upcoming)S.upcoming=[];const arr=c==='s'?'sessions':'upcoming';S[arr]=S[arr].filter(y=>y.id!==x.id);
   if(x.deleted){SY.tomb[c][x.id]=x.updatedAt;delete SY.snap[c][x.id];delete SY.st[c][x.id]}else{S[arr].push(x.data);SY.snap[c][x.id]=hsh(x.data);SY.st[c][x.id]=x.updatedAt;delete SY.tomb[c][x.id]}changed=true}
  if(j.meta&&j.meta.updatedAt>(SY.st.m||0)){META_F.forEach(f=>{if(j.meta.data&&f in j.meta.data&&j.meta.data[f]!=null)S[f]=j.meta.data[f]});SY.st.m=j.meta.updatedAt;SY.snap.m=hsh(metaOf());changed=true}
  SY.last=j.now;SY.lastOk=Date.now();localStorage.setItem(K,JSON.stringify(S));setSyncStatus(`Synced ✓ ${changes.length} up · ${(j.recs||[]).length} down`);if(changed){_rc=null;render()}}
 catch(e){setSyncStatus('Sync failed: '+e.message+' — will retry')}finally{_syncing=false}}
function syncStatusHTML(){return`<div><b>${esc(SY.status)}</b></div><div class="mut">${SY.lastOk?'Last synced '+new Date(SY.lastOk).toLocaleString():'Never synced'}${SY.acct?' · account '+SY.acct.slice(0,8):''}</div>`}
function linkKey(v){v=(v||'').trim();if(!/^[0-9a-f]{48}$/.test(v))return alert('That doesn’t look like a sync key');if(!confirm('Link this device to that sync account? Local data will be merged into it.'))return;SY.key=v;SY.acct=null;SY.last=0;for(const c of ['s','u'])COLL[c]().forEach(x=>{SY.dirty[c][x.id]=1});SY.dirty.m=1;saveSY();syncNow().then(()=>vSet())}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const fmtD=s=>parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const norm=n=>(n||'').trim().replace(/\s+/g,' ');const key=n=>norm(n).toLowerCase();
const uid=()=>Math.random().toString(36).slice(2,10);
const kg=()=>S.unit==='kg'?S.weight:S.weight*0.453592;
function lbmKg(){const bf=+((S.profile||{}).bf);return bf>0&&bf<70?kg()*(1-bf/100):null}
function bmr(){const l=lbmKg();return l?370+21.6*l:null} // Katch-McArdle
function cals(type,mins,int){let m=type==='match'?7:6;m*=int==='Easy'?.8:int==='Hard'?1.2:1;const b=bmr();const perMetHr=b?b/24:kg();return Math.round(m*perMetHr*mins/60)}
const sessCal=s=>+s.kcal>0?+s.kcal:cals(s.type,s.mins,s.int);
const sorted=()=>[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||'')||(b.ts||0)-(a.ts||0));
const allM=()=>sorted().filter(s=>s.type==='match');
let gtF='all';const matches=()=>allM().filter(s=>gtF==='all'||s.gtype===gtF);
const GT={A:'Advanced',I:'Intermediate'};
const GRADES=['A+','A','A-','B+','B','B-','C+','C','C-','D+','D','D-','F'],GV={'A+':4.3,A:4,'A-':3.7,'B+':3.3,B:3,'B-':2.7,'C+':2.3,C:2,'C-':1.7,'D+':1.3,D:1,'D-':0.7,F:0},GCOL={'A+':'#30d158',A:'#30d158','A-':'#30d158','B+':'#a3e635',B:'#a3e635','B-':'#a3e635','C+':'#ffd60a',C:'#ffd60a','C-':'#ffd60a','D+':'#ff9f0a',D:'#ff9f0a','D-':'#ff9f0a',F:'#ff453a'};
const gBadge=g=>g?`<span class="tag" style="background:${GCOL[g]}22;color:${GCOL[g]};border:1px solid ${GCOL[g]}66">${g}</span>`:'';
const gLetter=v=>{if(v==null)return'—';let best='F',bd=1e9;for(const g of GRADES){const d=Math.abs(GV[g]-v);if(d<bd){bd=d;best=g}}return best};
const avgG=l=>{const g=l.filter(s=>s.grade);return g.length?g.reduce((a,s)=>a+GV[s.grade],0)/g.length:null};
const gTxt=l=>{const v=avgG(l),n=l.filter(s=>s.grade).length;return v==null?'<span class="mut">—</span>':`<b style="color:${GCOL[gLetter(v)]}">${gLetter(v)}</b> <span class="mut">${v.toFixed(1)} · ${n}</span>`};
let modalCharts=[];
const LEFTY_SEED={ronnie:1,'dave h':1};
const isLefty=k=>{const o=(S.lefty||{})[k];return o!=null?!!o:!!LEFTY_SEED[k]};
function setLefty(k,v){S.lefty=S.lefty||{};S.lefty[k]=v?1:0;save();openPlayer(k)}
function setStart(k,v){S.startLevels=S.startLevels||{};if(v===''||isNaN(+v))delete S.startLevels[k];else S.startLevels[k]=Math.min(7,Math.max(0,+v));save();_rc=null;if(k==='me'){if(tab==='set')vSet()}else openPlayer(k)}
// ---------- RATINGS (0-7, Elo-style) ----------
const START_LEVELS={me:4.5,juan:6,steve:4.25,stephen:3.25,miles:4.25,robbie:3.5,ronnie:3.5,flor:4,todd:5,pietro:5.25,jj:5.5,dani:5.5,blake:5.25,umberto:5.5,ed:5,anders:4,griff:3.5,adam:3.25,charlie:3,daniel:3,russ:3.75,'dave h':5.25,nico:4.75};
const DEFAULT_LEVEL=3.5,RSCALE=1.5; // win prob = 1/(1+10^(-(teamA-teamB)/1.5))
const kFac=n=>0.1+0.3/(1+n/5); // 0.40 for a new player, ~0.25 after 5 matches, ~0.16 after 20
function startLevel(k){const o=(S.startLevels||{})[k];return o!=null&&o!==''?+o:(START_LEVELS[k]??DEFAULT_LEVEL)}
let _rc=null,_rcKey='';
function ratings(){const ck=JSON.stringify([S.sessions.length,S.startLevels,S.sessions.map(x=>x.id+x.result+x.date+(x.time||'')+scoreStr(x)+x.partner+(x.opps||[]).join())]);if(_rc&&_rcKey===ck)return _rc;
 const R={},N={},H={},pre={};const get=k=>{if(R[k]==null){R[k]=startLevel(k);N[k]=0;H[k]=[{date:null,r:R[k]}]}return R[k]};
 const asc=[...allM()].sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')||(a.ts||0)-(b.ts||0));
 asc.forEach(m=>{const A=['me',key(m.partner)].filter(Boolean),B=m.opps.map(key).filter(Boolean);if(A.length<1||B.length<1)return;
  pre[m.id]={};[...A,...B].forEach(k=>pre[m.id][k]=get(k));
  let sc=m.result==='W'?1:m.result==='L'?0:m.result==='X'?.5:null;
  if(m.result==='U'){const g=gamesOf(m);sc=g[0]+g[1]?g[0]/(g[0]+g[1]):null} // unfinished: use share of games won
  if(sc==null)return;const av=t=>t.reduce((a,k)=>a+R[k],0)/t.length;const E=1/(1+Math.pow(10,-(av(A)-av(B))/RSCALE));
  const upd=(k,sgn)=>{R[k]=Math.min(7,Math.max(0,R[k]+sgn*kFac(N[k])*(sc-E)));N[k]++;H[k].push({date:m.date,r:R[k]})};A.forEach(k=>upd(k,1));B.forEach(k=>upd(k,-1))});
 _rcKey=ck;_rc={R,N,H,pre};return _rc}
const rt=k=>{const x=ratings();return x.R[k]??startLevel(k)};
function spark(h,w=80,hh=22){if(!h||h.length<2)return'';const v=h.map(x=>x.r),mn=Math.min(...v)-.05,mx=Math.max(...v)+.05;const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(hh-(y-mn)/(mx-mn)*hh).toFixed(1)}`).join(' ');const up=v[v.length-1]>=v[0];return`<svg width="${w}" height="${hh}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${up?'#30d158':'#ff453a'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`}
function trendTxt(h){if(!h||h.length<2)return'<span class="mut">—</span>';const d=h[h.length-1].r-h[0].r;return d>=0.005?`<span style="color:var(--win)">▲${d.toFixed(2)}</span>`:d<=-0.005?`<span style="color:var(--loss)">▼${(-d).toFixed(2)}</span>`:'<span class="mut">▬</span>'}
function suggestGT(partner,opps){const ks=[key(partner),...opps.map(key)].filter(Boolean);if(!ks.length)return'I';const a=ks.reduce((x,k)=>x+rt(k),0)/ks.length;return a>=4.5?'A':'I'}
const gtChip=()=>`<div class="seg" style="margin-bottom:16px">${[['all','All games'],['A','Advanced'],['I','Intermediate']].map(([c,t])=>`<button class="${gtF===c?'on':''}" onclick="gtF='${c}';render()">${t}</button>`).join('')}</div>`;
// canonical display name for a key
function allNames(){const m={};[...S.sessions,...(S.upcoming||[])].forEach(s=>[s.partner,...(s.opps||[])].forEach(n=>{if(norm(n))m[key(n)]=m[key(n)]||norm(n)}));return m}
const P=n=>n?`<span class="p" onclick="event.stopPropagation();openPlayer('${esc(key(n)).replace(/'/g,"\\'")}')">${esc(norm(n))}</span>`:'—';
const scoreStr=s=>(s.sets||[]).filter(x=>x&&(x[0]!==''||x[1]!=='')).map(x=>x[0]+'-'+x[1]).join(', ');
const gamesOf=s=>(s.sets||[]).reduce((a,x)=>[a[0]+(+x[0]||0),a[1]+(+x[1]||0)],[0,0]);

let tab="stats",editId=null,F=null;

function predictHTML(u){const all=allM(),nm=allNames(),d=sidesOf(u);const pk=key(u.partner),o=(u.opps||[]).map(key);const nmK=k=>esc(nm[k]||k);
 const miss=[!pk&&'partner',!o[0]&&'opponent 1',!o[1]&&'opponent 2'].filter(Boolean);const ev=[],used=new Set();const add=(t,l,extra='')=>{if(!l.length)return;l.forEach(x=>used.add(x.id));const q=grpStats(l);ev.push(`<div>• ${t}: <b>${RS(q)}</b>${q.d?' ('+PCT(q)+')':''} <span class="mut">${l.length} match${l.length>1?'es':''}${extra}</span></div>`)};
 let head='';
 if(!miss.length){const a=(rt('me')+rt(pk))/2,b=(rt(o[0])+rt(o[1]))/2,E=1/(1+Math.pow(10,-(a-b)/RSCALE));const c=E>=.6?'var(--win)':E<=.4?'var(--loss)':'var(--tie)';

 else head=`<div class="mut">⚠️ ${miss.join(', ')} TBD — no win probability until all 4 players are known.${[pk,...o].filter(Boolean).length?' Known ratings: Me '+rt('me').toFixed(2)+[pk,...o].filter(Boolean).map(k=>' · '+nmK(k)+' '+rt(k).toFixed(2)).join(''):''}</div>`;
 if(o[0]&&o[1]){const pkey=[...o].sort().join('|');add(`Vs ${nmK(o[0])} & ${nmK(o[1])} as a pair`,all.filter(m=>pairKey(m)===pkey))}

 if(pk)add(`With ${nmK(pk)} as partner`,all.filter(m=>key(m.partner)===pk));
 const ccI=d.me&&(d.o1===d.me?0:d.o2===d.me?1:-1);if(ccI>=0&&o[ccI]){const l=all.filter(m=>crossOpp(m)===o[ccI]);if(l.length){const q=ccStats(l);add(`Cross-court vs ${nmK(o[ccI])}`,l,` · games ${sgn(q.diff)}`)}else ev.push(`<div class="mut">• No cross-court history vs ${nmK(o[ccI])}</div>`)}
 if(d.me&&u.gtype)add(`Me on the ${d.me==='L'?'left':'right'} in ${GT[u.gtype]}`,all.filter(m=>sidesOf(m).me===d.me&&m.gtype===u.gtype));
