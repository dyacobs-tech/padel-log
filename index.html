<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel Log</title><meta name="theme-color" content="#000000"><link rel="preconnect" href="https://rsms.me/"><link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script src="chart.umd.min.js"></script>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Padel Log">
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--txt:#f5f5f7;--mut:#8e8e93;--acc:#c6f432;--win:#30d158;--loss:#ff453a;--tr:#0a84ff;--bd:rgba(255,255,255,.08);--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:auto}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}h1 b{color:var(--acc)}
main{padding:0 16px;max-width:640px;margin:auto;animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:0 0 16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,24,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bd);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:6px 0;font:500 10px/1.2 inherit;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--acc)}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:16px 0 8px}
input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid transparent;border-radius:12px;padding:12px;font:16px inherit;outline:none;transition:border-color .2s}input:focus,textarea:focus{border-color:var(--acc)}
.seg{display:flex;gap:2px;background:var(--card2);border-radius:12px;padding:3px}.seg button{flex:1;padding:8px;border-radius:10px;border:0;background:none;color:var(--txt);font:600 14px inherit;transition:all .2s}.seg button.on{background:#48484a;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.btn{background:var(--acc);color:#000;border:0;border-radius:14px;padding:14px 16px;font:700 16px inherit;width:100%;margin-top:16px;transition:transform .1s,opacity .2s}.btn:active{transform:scale(.98);opacity:.85}.btn.sec{background:var(--card2);color:var(--txt)}.btn.red{background:rgba(255,69,58,.15);color:var(--loss)}
.row{display:flex;gap:8px}.row>*{flex:1}.sets{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.card .kpis{margin:0}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}.card .kpi{background:var(--card2);border:0}
.kpi b{font-size:28px;font-weight:700;letter-spacing:-.5px;display:block;color:var(--txt)}.kpi small{color:var(--mut);font-size:12px}
.pill{display:inline-block;width:24px;height:24px;border-radius:8px;margin:2px;text-align:center;font-size:12px;line-height:24px;font-weight:700;color:#000}.W{background:var(--win);color:#000}.L{background:var(--loss);color:#fff}.T{background:var(--tr);color:#fff}
.item{border-bottom:1px solid var(--bd);padding:12px 0}.item:last-child{border:0;padding-bottom:0}.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}.mut{color:var(--mut);font-size:13px}
.p{color:var(--txt);font-weight:600;border-bottom:1px dashed rgba(198,244,50,.6);cursor:pointer}.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.3px}
.acts button{background:var(--card2);border:0;color:var(--mut);border-radius:999px;padding:4px 12px;margin-left:4px;font:500 12px inherit}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}tr:last-child td{border:0}th{color:var(--mut);font-weight:500;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:11px;color:var(--mut);font-weight:600;padding-bottom:4px}.cal .d{border-radius:12px;min-height:48px;padding:8px 0 4px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}
.cal .d.o{opacity:.25}.cal .d.today{color:var(--acc);font-weight:700}.cal .d.sel{background:var(--card2);border-color:var(--bd)}.dots{display:flex;justify-content:center;gap:3px;margin-top:4px;min-height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.nav2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.nav2 button{background:var(--card2);border:0;color:var(--txt);border-radius:999px;width:36px;height:36px;font-size:18px}.nav2 b{flex:1;text-align:center;font-size:17px}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding-bottom:calc(32px + env(safe-area-inset-bottom));animation:slide .28s cubic-bezier(.2,.8,.2,1)}@keyframes slide{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}.hidden{display:none}
.big{font-size:32px;font-weight:800;letter-spacing:-.6px;color:var(--txt)}.demo{background:rgba(255,214,10,.12);color:#ffd60a;border-radius:12px;padding:8px 12px;font-size:13px}
#calest{color:var(--acc)}
</style></head><body>
<header><h1>PADEL <b>LOG</b></h1><span class="mut" id="hdrinfo"></span></header>
<div id="due"></div><main id="app"></main>
<div id="modal" class="modal hidden"></div>
<nav id="nav"></nav>
<datalist id="names"></datalist>
<script>
const K='padellog.v2';
let S=JSON.parse(localStorage.getItem(K)||'null')||{sessions:[],weight:176,unit:'lb'};
if(!S.upcoming)S.upcoming=[];
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const fmtD=s=>parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const norm=n=>(n||'').trim().replace(/\s+/g,' ');const key=n=>norm(n).toLowerCase();
const uid=()=>Math.random().toString(36).slice(2,10);
const kg=()=>S.unit==='kg'?S.weight:S.weight*0.453592;
function cals(type,mins,int){let m=type==='match'?7:6;m*=int==='Easy'?.8:int==='Hard'?1.2:1;return Math.round(m*kg()*mins/60)}
const sorted=()=>[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||'')||(b.ts||0)-(a.ts||0));
const matches=()=>sorted().filter(s=>s.type==='match');
// canonical display name for a key
function allNames(){const m={};[...S.sessions,...(S.upcoming||[])].forEach(s=>[s.partner,...(s.opps||[])].forEach(n=>{if(norm(n))m[key(n)]=m[key(n)]||norm(n)}));return m}
const P=n=>n?`<span class="p" onclick="event.stopPropagation();openPlayer('${esc(key(n)).replace(/'/g,"\\'")}')">${esc(norm(n))}</span>`:'—';
const scoreStr=s=>(s.sets||[]).filter(x=>x&&(x[0]!==''||x[1]!=='')).map(x=>x[0]+'-'+x[1]).join(', ');
const gamesOf=s=>(s.sets||[]).reduce((a,x)=>[a[0]+(+x[0]||0),a[1]+(+x[1]||0)],[0,0]);

let tab="log",editId=null,F=null;
const ICONS={"log": "<path d=\"M12 5v14M5 12h14\"/>", "cal": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>", "stats": "<path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"/>", "match": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5\"/><circle cx=\"17\" cy=\"9\" r=\"2.5\"/><path d=\"M17 14c2.4 0 4 1.6 4.6 4.5\"/>", "hist": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "set": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/>"};
const TABS=[['log','➕','Log'],['cal','📅','Calendar'],['stats','📊','Stats'],['match','🤝','Matchups'],['hist','📜','History'],['set','⚙️','Settings']];
function renderNav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${ICONS[t[0]]}</svg>${t[2]}</button>`).join('')}
let charts=[];function killCharts(){charts.forEach(c=>c.destroy());charts=[]}
function go(t){tab=t;closeModal();render();scrollTo(0,0)}
function render(){killCharts();renderNav();renderDue();$('#hdrinfo').textContent=S.sessions.length+' sessions';({log:vLog,cal:vCal,stats:vStats,match:vMatch,hist:vHist,set:vSet})[tab]();
 $('#names').innerHTML=Object.values(allNames()).sort().map(n=>`<option value="${esc(n)}">`).join('')}

// ---------- LOG ----------
function blank(){return{type:'match',date:today(),time:(d=>pad(d.getHours())+':'+pad(d.getMinutes()))(new Date()),mins:90,int:'Normal',partner:'',opps:['',''],sets:[['',''],['',''],['','']],result:'W',club:'',notes:'',sides:{me:'L',partner:'R',o1:'L',o2:'R'}}}
const bucket=t=>{if(!t)return null;const h=+t.split(':')[0];return h<12?'Morning':h<17?'Afternoon':'Evening'};const TM=s=>s.time?' · '+s.time+' ('+bucket(s.time)+')':'';
const opp=x=>x==='L'?'R':'L';const SD=x=>x?` <small class="tag" style="background:#2c2c2e;color:#c6f432">${x}</small>`:'';
const sidesOf=s=>s.sides||{};
function sideFor(s,k){const d=sidesOf(s);if(key(s.partner)===k)return d.partner;if(key(s.opps[0])===k)return d.o1;if(key(s.opps[1])===k)return d.o2}
const SIDE_DEFAULTS={griff:'L',juan:'R',steve:'L',russ:'L',miles:'L',flor:'L',ronnie:'L',kirby:'L',robbie:'L',simon:'L',adam:'L'}; // my side with that partner
function autoSide(){const k=key(F.partner);if(!k)return;if(USUAL_SIDE[k]){F.sides.partner=USUAL_SIDE[k];F.sides.me=opp(USUAL_SIDE[k]);vLog();return}const last=matches().find(s=>key(s.partner)===k&&s.id!==editId&&sidesOf(s).me);const me=last?sidesOf(last).me:SIDE_DEFAULTS[k];if(!me)return;F.sides.me=me;F.sides.partner=last&&sidesOf(last).partner||opp(me);vLog()}
const USUAL_SIDE={ronnie:'R',griff:'R'}; // fixed usual side for any role
function lastSide(k){if(USUAL_SIDE[k])return USUAL_SIDE[k];const m=matches().find(s=>s.id!==editId&&sideFor(s,k));return m?sideFor(m,k):null}
function autoOpp(i){const k=key(F.opps[i]);if(!k)return;const sd=lastSide(k);if(!sd)return;const me='o'+(i+1),ot='o'+(2-i);F.sides[me]=sd;const ok=key(F.opps[1-i]),os=ok&&lastSide(ok);F.sides[ot]=os&&os!==sd?os:opp(sd);vLog()}
function setSide(w,v){F.sides[w]=v;if(w==='me')F.sides.partner=opp(v);if(w==='o1')F.sides.o2=opp(v);vLog()}
const sideSeg=(w,l)=>`<div class="row" style="align-items:center;margin-top:4px"><span class="mut" style="flex:0 0 90px">${l}</span><div class="seg">${['L','R'].map(v=>`<button class="${F.sides[w]===v?'on':''}" onclick="setSide('${w}','${v}')">${v==='L'?'Left':'Right'}</button>`).join('')}</div></div>`;
function vLog(){
 if(!F)F=blank();const f=F,up=f.type==='upcoming',m=f.type==='match'||up;
 $('#app').innerHTML=`${upListHTML()}<div class="card"><h2>${f.upEdit?'Edit upcoming match':f.upId?'How did it go? Enter score & result':editId?'Edit session':'New session'}</h2>
 <div class="seg">${(f.upId?['match']:f.upEdit?['upcoming']:['match','training','upcoming']).map(t=>`<button class="${f.type===t?'on':''}" onclick="F.type='${t}';vLog()">${t==='match'?'🎾 Match':t==='training'?'🏋️ Training':'📅 Upcoming'}</button>`).join('')}</div>
 <label>Date</label><input type="date" value="${f.date}" onchange="F.date=this.value"><label>Start time</label><input type="time" value="${F.time||''}" onchange="F.time=this.value">
 <label>Duration</label><div class="seg">${[60,90,120].map(v=>`<button class="${f.mins==v?'on':''}" onclick="F.mins=${v};vLog()">${v/60}h</button>`).join('')}</div>
 <input type="number" min="1" style="margin-top:6px" value="${f.mins}" oninput="F.mins=+this.value;upd()" placeholder="minutes">
 <label>Intensity</label><div class="seg">${['Easy','Normal','Hard'].map(v=>`<button class="${f.int===v?'on':''}" onclick="F.int='${v}';vLog()">${v}</button>`).join('')}</div>
 ${m?`<label>Partner</label><input list="names" value="${esc(f.partner)}" oninput="F.partner=this.value" onchange="F.partner=this.value;autoSide()" placeholder="Partner name">
 <label>Opponents</label><div class="row"><input list="names" value="${esc(f.opps[0])}" oninput="F.opps[0]=this.value" onchange="F.opps[0]=this.value;autoOpp(0)" placeholder="Opponent 1"><input list="names" value="${esc(f.opps[1])}" oninput="F.opps[1]=this.value" onchange="F.opps[1]=this.value;autoOpp(1)" placeholder="Opponent 2"></div>
 <label>Court sides</label>${sideSeg('me','Me')}${sideSeg('partner','Partner')}${sideSeg('o1','Opponent 1')}${sideSeg('o2','Opponent 2')}
 ${up?'':`<label>Score</label><div class="sets"><span></span><small class="mut">Us</small><small class="mut">Them</small>${[0,1,2].map(i=>`<span class="mut">Set ${i+1}</span><input type="number" min="0" value="${f.sets[i][0]}" oninput="F.sets[${i}][0]=this.value"><input type="number" min="0" value="${f.sets[i][1]}" oninput="F.sets[${i}][1]=this.value">`).join('')}</div>
 <label>Result</label><div class="seg"><button class="${f.result==='W'?'on':''}" onclick="F.result='W';vLog()">Won</button><button class="${f.result==='L'?'on':''}" onclick="F.result='L';vLog()">Lost</button></div>`}
 <label>Club / court</label><input value="${esc(f.club)}" oninput="F.club=this.value" placeholder="Club or court">`:`<label>Club / location</label><input value="${esc(f.club)}" oninput="F.club=this.value">`}
 <label>Notes</label><textarea rows="2" oninput="F.notes=this.value">${esc(f.notes)}</textarea>
 <div class="kpi" style="margin-top:12px"><small>Estimated calories</small><b id="calest"></b></div>
 <button class="btn" onclick="saveForm()">${up?(f.upEdit?'Save upcoming match':'Schedule match'):f.upId?'Log result':editId?'Save changes':'Log session'}</button>
 ${editId||f.upEdit||f.upId?`<button class="btn sec" onclick="editId=null;F=blank();vLog()">${f.upId?'Not now':'Cancel edit'}</button>`:''}</div>`;upd()}
function upd(){const e=$('#calest');if(e)e.textContent=cals(F.type==='upcoming'?'match':F.type,F.mins||0,F.int)+' kcal'}
function saveForm(){const f=F;if(!f.date||!(f.mins>0))return alert('Date and duration required');
 if(f.type==='upcoming'){const nm=allNames();const c=n=>nm[key(n)]||norm(n);const u={id:f.upEdit||uid(),date:f.date,time:f.time||'',mins:+f.mins,int:f.int,club:norm(f.club),notes:f.notes.trim(),partner:c(f.partner),opps:f.opps.map(c),sides:{...f.sides}};
  S.upcoming=S.upcoming.filter(x=>x.id!==u.id);S.upcoming.push(u);save();editId=null;F=blank();selDay=u.date;go('log');return}
 if(f.upId)S.upcoming=S.upcoming.filter(x=>x.id!==f.upId);
 const s={id:editId||uid(),ts:Date.now(),type:f.type,date:f.date,time:f.time||'',mins:+f.mins,int:f.int,club:norm(f.club),notes:f.notes.trim()};
 if(f.type==='match'){const nm=allNames();const c=n=>nm[key(n)]||norm(n);s.partner=c(f.partner);s.opps=f.opps.map(c);s.sets=f.sets;s.result=f.result;s.sides={...f.sides}}
 const old=S.sessions.find(x=>x.id===editId);if(old){s.demo=old.demo;s.ts=old.ts}
 S.sessions=S.sessions.filter(x=>x.id!==s.id);S.sessions.push(s);save();editId=null;F=blank();go('hist')}
function editS(id){const s=S.sessions.find(x=>x.id===id);editId=id;F=Object.assign(blank(),JSON.parse(JSON.stringify(s)));if(!F.sets)F.sets=[['',''],['',''],['','']];if(!F.opps)F.opps=['',''];if(!F.sides)F.sides=blank().sides;go('log')}
function delS(id){if(!confirm('Delete this session?'))return;S.sessions=S.sessions.filter(x=>x.id!==id);save();if(!$('#modal').classList.contains('hidden')&&curPlayer)openPlayer(curPlayer);render()}

function itemHTML(s,showDate=true){const c=cals(s.type,s.mins,s.int);
 if(s.type==='match')return`<div class="item"><div class="top"><div><span class="tag ${s.result}">${s.result==='W'?'WON':'LOST'}</span> <b>${scoreStr(s)||'—'}</b></div><div class="acts"><button onclick="editS('${s.id}')">Edit</button><button onclick="delS('${s.id}')">Del</button></div></div>
 <div>Me${SD(sidesOf(s).me)} w/ ${P(s.partner)}${SD(sidesOf(s).partner)} vs ${P(s.opps[0])}${SD(sidesOf(s).o1)} & ${P(s.opps[1])}${SD(sidesOf(s).o2)}</div><div class="mut">${showDate?fmtD(s.date)+TM(s):(s.time?s.time+' ('+bucket(s.time)+')':'')} · ${s.mins} min · ${s.int} · ${c} kcal${s.club?' · '+esc(s.club):''}${s.demo?' · demo':''}</div>${s.notes?`<div class="mut">📝 ${esc(s.notes)}</div>`:''}</div>`;
 return`<div class="item"><div class="top"><div><span class="tag T">TRAINING</span></div><div class="acts"><button onclick="editS('${s.id}')">Edit</button><button onclick="delS('${s.id}')">Del</button></div></div><div class="mut">${showDate?fmtD(s.date)+TM(s):(s.time?s.time+' ('+bucket(s.time)+')':'')} · ${s.mins} min · ${s.int} · ${c} kcal${s.club?' · '+esc(s.club):''}${s.demo?' · demo':''}</div>${s.notes?`<div class="mut">📝 ${esc(s.notes)}</div>`:''}</div>`}

// ---------- UPCOMING ----------
const upEnd=u=>{const d=parse(u.date);const[h,mi]=(u.time||'23:59').split(':').map(Number);d.setHours(h,mi+(+u.mins||0));return d};
const upSorted=()=>[...S.upcoming].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const dueList=()=>upSorted().filter(u=>upEnd(u)<=new Date());
function upItem(u,showDate=true){const d=sidesOf(u),due=upEnd(u)<=new Date();return`<div class="item"><div class="top"><div><span class="tag" style="border:1.5px solid var(--acc);color:var(--acc)">${due?'PLAYED?':'UPCOMING'}</span> <b>${showDate?fmtD(u.date):''}${u.time?' '+u.time:''}</b></div><div class="acts">${due?`<button style="color:var(--acc)" onclick="completeUp('${u.id}')">Log result</button>`:''}<button onclick="editUp('${u.id}')">Edit</button><button onclick="cancelUp('${u.id}')">Cancel</button></div></div>

let hF='all';
function vHist(){const l=sorted().filter(s=>hF==='all'||s.type===hF);
 $('#app').innerHTML=`${upListHTML()}<div class="card"><div class="seg">${['all','match','training'].map(t=>`<button class="${hF===t?'on':''}" onclick="hF='${t}';vHist()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${l.map(s=>itemHTML(s)).join('')||'<div class="mut" style="margin-top:10px">No sessions yet.</div>'}</div>`}

// ---------- PAIR SCOUTING
const pairKey=s=>s.opps.map(key).sort().join('|');
function openPair(pk){curPlayer=null;const nm=allNames(),[a,b]=pk.split('|'),A=nm[a]||a,B=nm[b]||b;const l=matches().filter(s=>pairKey(s)===pk);const st=grpStats(l);
 const sideCnt=k=>{const c={L:0,R:0};l.forEach(s=>{const x=sideFor(s,k);if(x)c[x]++});const t=c.L+c.R;return t?`${Math.round(c.L/t*100)}% Left / ${Math.round(c.R/t*100)}% Right`:'no side data'};
 const setups=[[`${esc(A)} Left / ${esc(B)} Right`,s=>sideFor(s,a)==='L'&&sideFor(s,b)==='R'],[`${esc(B)} Left / ${esc(A)} Right`,s=>sideFor(s,b)==='L'&&sideFor(s,a)==='R']];
 const combos={};l.forEach(s=>{const c=norm(s.partner)+'|'+(sidesOf(s).me||'?');(combos[c]=combos[c]||[]).push(s)});
 const cr=Object.entries(combos).map(([c,v])=>[c,grpStats(v)]).sort((x,y)=>y[1].p-x[1].p||y[1].n-x[1].n);
 const sc={};l.forEach(s=>{const t=scoreStr(s);if(t)sc[t]=(sc[t]||0)+1});
 const avg=l.length?l.reduce((q,s)=>{const g=gamesOf(s);return[q[0]+g[0],q[1]+g[1]]},[0,0]).map(x=>(x/l.length).toFixed(1)):null;
 $('#modal').innerHTML=`<header><button class="btn sec" style="width:auto;margin:0;padding:8px 14px" onclick="closeModal()">‹ Back</button><span class="mut">Pair scouting</span></header><main>
 <div class="card"><div class="big" style="font-size:24px">${P(A)} & ${P(B)}</div><div class="mut">${l.length} matches · last played ${l[0]?fmtD(l[0].date):'—'}</div></div>
 <div class="card"><h2>My record vs them</h2><div class="kpis"><div class="kpi"><small>W-L</small><b>${st.w}-${st.l}</b></div><div class="kpi"><small>Win %</small><b>${st.n?Math.round(st.p*100)+'%':'—'}</b></div></div></div>
 <div class="card"><h2>Their usual sides</h2><div>${esc(A)}: <b>${sideCnt(a)}</b></div><div>${esc(B)}: <b>${sideCnt(b)}</b></div>
 <table style="margin-top:8px"><tr><th>Their setup</th><th>My W-L</th><th>Win%</th></tr>${setups.map(([t,f])=>{const o=grpStats(l.filter(f));return`<tr><td>${t}</td><td>${o.w}-${o.l}</td><td>${o.n?Math.round(o.p*100)+'%':'—'}</td></tr>`}).join('')}</table></div>
 <div class="card"><h2>My best partner & side vs them</h2><table><tr><th>Partner</th><th>My side</th><th>W-L</th><th>Win%</th></tr>${cr.map(([c,o],i)=>{const[pn,sd]=c.split('|');return`<tr style="${i===0?'color:#c6f432;font-weight:700':''}"><td>${P(pn)}${i===0?' ⭐':''}</td><td>${sd==='L'?'Left':sd==='R'?'Right':'?'}</td><td>${o.w}-${o.l}</td><td>${Math.round(o.p*100)}%</td></tr>`}).join('')}</table></div>
 <div class="card"><h2>Typical scores</h2>${avg?`<div class="mut">Avg games per match: me ${avg[0]} – them ${avg[1]}</div>`:''}${Object.entries(sc).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([t,n])=>`<div>${t}${n>1?' ×'+n:''}</div>`).join('')||'<div class="mut">No scores</div>'}</div>
 <div class="card"><h2>Matches</h2>${l.map(s=>itemHTML(s)).join('')}</div></main>`;
 $('#modal').classList.remove('hidden');$('#modal').scrollTop=0}
// ---------- PLAYER ----------
let curPlayer=null;
function openPlayer(k){curPlayer=k;const nm=allNames(),name=nm[k]||k,ms=matches();
 const vs=ms.filter(s=>s.opps.map(key).includes(k)),wi=ms.filter(s=>key(s.partner)===k);
 const [vw,vl]=rec(vs),[pw,pl]=rec(wi);const g=vs.reduce((a,s)=>{const x=gamesOf(s);return[a[0]+x[0],a[1]+x[1]]},[0,0]);const gp=wi.reduce((a,s)=>{const x=gamesOf(s);return[a[0]+x[0],a[1]+x[1]]},[0,0]);
 const all=ms.filter(s=>vs.includes(s)||wi.includes(s));
 const row=s=>{const isOpp=s.opps.map(key).includes(k);const mate=isOpp?s.opps.find(o=>key(o)!==k):null;const d=sidesOf(s),ms2=n=>SD(sideFor(s,key(n)));
  return`<div class="item"><div class="top"><div><span class="tag ${s.result}">${s.result==='W'?'WON':'LOST'}</span> <b>${scoreStr(s)||'—'}</b></div><span class="mut">${isOpp?'Opponent':'Partner'}</span></div>
  <div class="mut">${fmtD(s.date)}${TM(s)}${s.club?' · '+esc(s.club):''}</div><div>${esc(name)}${SD(sideFor(s,k))} · Me${SD(d.me)}<br>${isOpp?`Their teammate: ${P(mate)}${ms2(mate)} · My partner: ${P(s.partner)}${ms2(s.partner)}`:`Together vs ${P(s.opps[0])}${ms2(s.opps[0])} & ${P(s.opps[1])}${ms2(s.opps[1])}`}</div></div>`};
 $('#modal').innerHTML=`<header><button class="btn sec" style="width:auto;margin:0;padding:8px 14px" onclick="closeModal()">‹ Back</button><span class="mut">Player</span></header><main>
 <div class="card"><div class="big" style="font-size:28px">${esc(name)}</div><div class="mut">${all.length} matches together or against · last ${all[0]?fmtD(all[0].date):'—'}</div></div>
 <div class="card"><h2>Head-to-head (vs them)</h2><div class="kpis"><div class="kpi"><small>Record</small><b>${vw}-${vl}</b></div><div class="kpi"><small>Win %</small><b>${vs.length?Math.round(vw/vs.length*100)+'%':'—'}</b></div><div class="kpi"><small>Games won</small><b>${g[0]}</b></div><div class="kpi"><small>Games lost</small><b>${g[1]}</b></div></div></div>
 <div class="card"><h2>Partnered with them</h2><div class="kpis"><div class="kpi"><small>Record</small><b>${pw}-${pl}</b></div><div class="kpi"><small>Win %</small><b>${wi.length?Math.round(pw/wi.length*100)+'%':'—'}</b></div><div class="kpi"><small>Games won</small><b>${gp[0]}</b></div><div class="kpi"><small>Games lost</small><b>${gp[1]}</b></div></div></div>
 <div class="card"><h2>Their sides</h2><table><tr><th></th><th>Their W-L (all)</th><th>My W-L vs them</th></tr>${['L','R'].map(x=>{const pr=(playerRecs()[k]||{L:[0,0],R:[0,0]})[x];const v=vs.filter(s=>sideFor(s,k)===x),w=v.filter(s=>s.result==='W').length;return`<tr><td>${x==='L'?'Left':'Right'}</td><td>${wl(pr)}</td><td>${w}-${v.length-w}${v.length?' ('+Math.round(w/v.length*100)+'%)':''}</td></tr>`}).join('')}</table><div class="mut" style="margin-top:6px">Their overall: ${(playerRecs()[k]||{w:0}).w}-${(playerRecs()[k]||{l:0}).l}</div></div>
 <div class="card"><h2>Pairs they've played in (vs me)</h2>${[...new Set(vs.map(pairKey))].map(q=>`<div class="item">${q.split('|').map(x=>esc(nm[x]||x)).join(' & ')} <button class="tag" style="background:rgba(198,244,50,.15);color:#c6f432;border:0" onclick="openPair('${esc(q).replace(/'/g,"\\'")}')">🔎 Scout</button></div>`).join('')||'<div class="mut">None</div>'}</div>
 <div class="card"><h2>All matches</h2>${all.map(row).join('')||'<div class="mut">None</div>'}</div></main>`;
 $('#modal').classList.remove('hidden');$('#modal').scrollTop=0}
function closeModal(){$('#modal').classList.add('hidden');curPlayer=null}

// ---------- SETTINGS ----------
function vSet(){const nd=S.sessions.filter(s=>s.demo).length;
 $('#app').innerHTML=`<div class="card"><h2>Body weight</h2><div class="row"><input type="number" value="${S.weight}" onchange="S.weight=+this.value||176;save()"><div class="seg">${['lb','kg'].map(u=>`<button class="${S.unit===u?'on':''}" onclick="setUnit('${u}')">${u}</button>`).join('')}</div></div>
 <div class="mut" style="margin-top:6px">Calories = MET × kg × hours. MET 7 match / 6 training; Easy ×0.8, Hard ×1.2.</div></div>
 <div class="card"><h2>Backup</h2><button class="btn" onclick="exportJ()">⬇ Export JSON</button><button class="btn sec" onclick="$('#imp').click()">⬆ Import JSON</button><input id="imp" type="file" accept=".json,application/json" class="hidden" onchange="importJ(this.files[0])"></div>
 <div class="card"><h2>Demo data</h2><div class="demo">DEMO: adds ~30 sample sessions (fake players) so you can try the features. Demo entries are tagged and can be removed without touching your real data.</div>
 <button class="btn sec" onclick="loadDemo()">Load demo data</button>${nd?`<button class="btn red" onclick="if(confirm('Remove ${nd} demo sessions?')){S.sessions=S.sessions.filter(s=>!s.demo);save();render()}">Remove demo data (${nd})</button>`:''}</div>
 <div class="card"><h2>Danger zone</h2><button class="btn red" onclick="if(confirm('Delete ALL sessions?')){S.sessions=[];save();render()}">Delete all data</button></div>`}
function setUnit(u){if(u===S.unit)return;S.weight=Math.round(u==='kg'?S.weight*0.453592:S.weight/0.453592);S.unit=u;save();vSet()}
function exportJ(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='padel-log-'+today()+'.json';a.click()}
function importJ(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);const ss=Array.isArray(d)?d:d.sessions;if(!Array.isArray(ss))throw 0;
 const rep=confirm('OK = replace all data with backup. Cancel = merge.');if(rep){S.sessions=ss;if(d.weight){S.weight=d.weight;S.unit=d.unit||'lb'}}else{const ids=new Set(S.sessions.map(s=>s.id));ss.forEach(s=>{if(!ids.has(s.id))S.sessions.push(s)})}
 S.sessions.forEach(s=>s.id=s.id||uid());save();render();alert('Imported '+ss.length+' sessions')}catch(e){alert('Invalid backup file')}})}
function loadDemo(){S.sessions=S.sessions.filter(s=>!s.demo);const R=n=>Math.floor(Math.random()*n),pk=a=>a[R(a.length)];
 const partners=['Carlos Ruiz','Mike Chen','Javi Ortega'],opps=['Alex Martin','Sam Patel','Tom Becker','Luis Gomez','Ben Hart','Diego Silva','Nico Rossi'],clubs=['Padel Haus Brooklyn','Court 16 LIC','Padel Haus Williamsburg','Reserve Padel'];
 for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()-R(120));const tr=Math.random()<.25;const hr=pk([7,8,9,10,12,13,15,16,18,19,20]);
  const s={id:uid(),ts:Date.now()+i,demo:true,date:iso(d),time:pad(hr)+':'+pk(['00','30']),mins:pk([60,90,90,120]),int:pk(['Easy','Normal','Normal','Hard']),club:pk(clubs),notes:'',type:tr?'training':'match'};
  if(!tr){const o1=pk(opps);let o2;do o2=pk(opps);while(o2===o1);s.partner=pk(partners);s.opps=[o1,o2];const W=Math.random()<.58;s.result=W?'W':'L';const me=Math.random()<.6?'L':'R',o=pk(['L','R']);s.sides={me,partner:opp(me),o1:o,o2:opp(o)};
   const set=w=>{const l=R(5);return w?[6,l]:[l,6]};let sets=[set(W),set(Math.random()<.5?W:!W)];if((sets[0][0]>sets[0][1])!==(sets[1][0]>sets[1][1]))sets.push(set(W));else sets.push(['','']);s.sets=sets}
  S.sessions.push(s)}save();render()}
function seedReal(){const r2=S.sessions.find(x=>x.id==='real2');if(r2&&r2.sides&&!r2.sides.o1){r2.sides.o1='L';r2.sides.o2='R';save()}const r3=S.sessions.find(x=>x.id==='real3');if(r3&&r3.sides&&!r3.sides.o1){r3.sides.o1='L';r3.sides.o2='R';save()}const r4=S.sessions.find(x=>x.id==='real4');if(r4&&r4.sides&&!r4.sides.o1){r4.sides.o1='L';r4.sides.o2='R';save()}if(localStorage.getItem('padellog.seeded1'))return;const st=[['',''],['',''],['','']];const M=(id,date,res,sets,partner,opps,sides)=>({id,ts:1,type:'match',date,time:'',mins:90,int:'Normal',club:'',notes:'',partner,opps,result:res,sets:[...sets,...st].slice(0,3),sides});
 const R=[{id:'real1',ts:1,type:'training',date:'2026-10-20',time:'',mins:90,int:'Normal',club:'',notes:'Drills'},
 M('real2','2026-10-19','W',[['7','5'],['6','2']],'Juan',['Todd','JJ'],{me:'R',partner:'L',o1:'L',o2:'R'}),
 M('real3','2026-10-19','L',[['6','7'],['6','4'],['4','4']],'Griff',['Steve','Miles'],{me:'L',partner:'R',o1:'L',o2:'R'}),
 M('real4','2026-10-18','W',[['6','4'],['6','1'],['6','3']],'Griff',['Miles','Ronnie'],{me:'L',partner:'R',o1:'L',o2:'R'})];
 const ids=new Set(S.sessions.map(x=>x.id));R.forEach(x=>{if(!ids.has(x.id))S.sessions.push(x)});save();localStorage.setItem('padellog.seeded1','1')}
seedReal();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
